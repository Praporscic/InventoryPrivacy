title: Inventory & Stock Manager
tagline: Simple offline stock tracking for iPhone and iPad
description: Inventory & Stock Manager is a free, offline inventory app for iPhone and iPad. Track products, sizes and stock levels, record sales and review your sales history. No account needed.
lang: en
url: https://praporscic.github.io
baseurl: /InventoryPrivacy

# Country-neutral App Store link: Apple redirects each visitor to their own storefront.
app_store_url: https://apps.apple.com/app/id6803559866
app_store_id: "6803559866"

plugins:
  - jekyll-sitemap

collections:
  articles:
    output: true
    permalink: /articles/:name/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
