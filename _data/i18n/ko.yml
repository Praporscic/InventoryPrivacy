privacy:
  h1: "개인정보 처리방침"
  intro: |-
    <p>
      Inventory &amp; Stock Manager(이하 “앱”)는 오프라인으로 작동하는 재고 관리 도구입니다. 상품, 사이즈,
      재고 수량을 추가하면 입력한 모든 내용이 사용자의 기기에만 저장됩니다. 계정도, 로그인도,
      저희가 운영하는 서버도 없으므로 앱은 데이터를 보내고 싶어도 보낼 곳이 없습니다.
      이 페이지에서는 앱을 사용할 때 어떤 데이터가 수집되고 어떤 데이터가 수집되지 않는지 설명합니다.
    </p>
  sections:
    - h: "수집하는 정보"
      body: |-
        <p>
          앱 자체는 어떤 서버에도 개인정보를 수집, 전송 또는 저장하지 않습니다.
          백엔드도, 사용자 계정도 없습니다. 저희는 이름, 이메일 주소, 전화번호,
          위치, 연락처, 건강 데이터를 요청하지 않으며, 앱에는 어떠한 분석 또는 비정상 종료 보고 SDK도
          포함되어 있지 않습니다.
        </p>
    - h: "기기에만 저장되는 정보"
      body: |-
        <p>
          입력한 모든 내용(상품 이름, 사이즈, 재고 수량, 판매 기록, 상품 사진, 선택한 앱 언어)은
          기기의 표준 저장소(로컬 데이터베이스와 로컬 파일 저장소)를 사용해 기기에 저장됩니다.
          이 중 어떤 것도 업로드, 동기화되거나 어디로도 전송되지 않습니다.
          상품을 삭제하거나 앱을 제거하면 해당 데이터는 다른 어디에도 존재하지 않으므로 완전히 사라집니다.
        </p>
    - h: "카메라 및 사진 보관함 접근"
      body: |-
        <p>
          상품에 사진을 첨부하기로 선택하면 사진을 고르거나 촬영할 수 있도록 앱이 카메라 또는
          사진 보관함 접근 권한을 요청합니다. 사진은 크기가 조정되어 기기 내 앱의 비공개 로컬 저장소에만
          저장되며, 저희나 제3자에게 업로드되지 않습니다.
        </p>
    - h: "구독 및 구매"
      body: |-
        <p>
          앱은 선택 사항인 Pro 업그레이드를 제공합니다. 구매는 Apple의 App Store 또는 Google
          Play에서 처리되며, 구독 상태는 제3자 구독 플랫폼인 <strong>RevenueCat</strong>이 저희를 대신해 관리합니다.
          RevenueCat은 무작위로 생성된 앱 사용자 식별자와 이용 권한 확인에 필요한
          구매/거래 데이터를 받습니다. 저희는 이름, 이메일, 결제 정보를 직접 수집하지 않으므로
          RevenueCat과 공유하지 않습니다. 데이터 처리에 관한 자세한 내용은
          RevenueCat의 개인정보 처리방침을 참고하세요.
        </p>
        <ul>
          <li><a href="https://www.revenuecat.com/privacy" target="_blank" rel="noopener">RevenueCat 개인정보 처리방침</a></li>
        </ul>
    - h: "광고"
      body: |-
        <p>
          앱에는 광고와 광고 SDK가 없으며, 다른 앱이나 웹사이트에서 사용자를 추적하지 않습니다.
        </p>
    - h: "아동의 개인정보"
      body: |-
        <p>
          이 앱은 일반 사용자를 대상으로 하며 13세 미만 아동을 특정하여 만든 것이 아닙니다.
          저희는 아동의 개인정보를 의도적으로 수집하지 않습니다. 아동이 이 앱을 통해
          개인정보를 제공했다고 생각되시면 저희가 조치할 수 있도록 연락해 주세요.
        </p>
    - h: "데이터 보안"
      body: |-
        <p>
          앱에는 백엔드가 없고 앱 자체가 개인 데이터를 전송하지 않으므로, 보호해야 할
          앱 관리형 원격 정보 저장소가 없습니다. 기기에 로컬로 저장된 데이터는
          기기 운영체제 자체의 보안으로 보호됩니다. 구독과 관련된 모든 데이터 처리는
          Apple, Google 또는 RevenueCat이 각자의 보안 및 개인정보 보호 정책에 따라 수행합니다.
        </p>
    - h: "사용자의 선택"
      body: |-
        <p>
          앱을 제거하면 기기에 저장된 모든 내용(상품, 사이즈, 재고, 판매 내역, 사진)이
          영구적으로 삭제됩니다. 이 데이터는 다른 어디에도 존재하지 않기 때문입니다. 구독은 언제든지
          Apple ID 또는 Google Play 계정 설정에서, 또는 앱 내 “구독 관리”를 통해 관리하거나 취소할 수 있습니다.
        </p>
    - h: "본 방침의 변경"
      body: |-
        <p>
          새로운 기능이나 SDK가 추가되는 등 본 방침이 변경되면 이 페이지가 그에 맞게
          업데이트됩니다. 이 페이지를 주기적으로 확인해 주시기 바랍니다.
        </p>
    - h: "문의하기"
      body: |-
        <p>
          이 개인정보 처리방침에 관한 질문이 있으시면 아래로 연락해 주세요.
          <br />
          <strong><a href="mailto:iosmyapps@yahoo.com">iosmyapps@yahoo.com</a></strong>
        </p>

about:
  hero_h1: "모든 재고를 한눈에, 내 손안에."
  hero_lead: "Inventory & Stock Manager는 iPhone과 iPad용 간단한 오프라인 재고 관리 앱입니다. 상품을 추가하고, 사이즈별로 재고를 세고, 판매를 기록하고, 부족한 상품을 확인하세요. 계정도 인터넷 연결도 필요 없습니다."
  read_overview: "전체 소개 읽기"
  hero_note: "무료 다운로드. 오프라인에서 작동. 데이터는 기기에만 저장됩니다."
  hero_img_alt: "사이즈와 재고 수량이 표시된 상품 목록을 보여 주는 iPhone의 Inventory & Stock Manager"
  features_h2: "재고 관리에 필요한 모든 것"
  features_sub: "작은 가게, 시장 판매자, 온라인 리셀러, 그리고 재고를 보유하며 빠르고 명확하게 파악하고 싶은 모든 분을 위해 만들었습니다."
  features:
    - ico: "📦"
      h: "사진이 있는 상품"
      p: "모든 상품에 이름, 사진, 가격, SKU, 설명을 추가해 한눈에 상품을 알아볼 수 있습니다."
    - ico: "📏"
      h: "사이즈별 재고"
      p: "상품마다 필요한 만큼 사이즈를 추가하고, 간단한 +/– 버튼으로 각 사이즈의 수량을 설정하세요."
    - ico: "🗂️"
      h: "나만의 카테고리"
      p: "색상, 브랜드, 공급업체 같은 목록을 만들어 상품에 연결하면 방대한 카탈로그도 깔끔하게 정리됩니다."
    - ico: "🔎"
      h: "검색 및 재고 필터"
      p: "원하는 상품을 즉시 찾고, 전체 / 재고 있음 / 재고 부족 / 품절로 필터링해 보충이 필요한 상품을 확인하세요."
    - ico: "🛒"
      h: "몇 초 만에 판매 기록"
      p: "상품, 사이즈, 수량, 날짜를 선택하세요. 판매를 저장하면 재고가 자동으로 업데이트됩니다."
    - ico: "📈"
      h: "판매 내역"
      p: "기록된 모든 판매를 상품, 사이즈, 수량, 날짜와 함께 확인하고 지난 판매를 검색할 수 있습니다."
    - ico: "🌍"
      h: "15개 언어"
      p: "영어, 중국어, 일본어, 스페인어, 프랑스어, 독일어, 한국어, 포르투갈어(브라질), 이탈리아어, 러시아어, 루마니아어, 아랍어, 튀르키예어, 네덜란드어, 인도네시아어."
    - ico: "🔒"
      h: "비공개 및 오프라인"
      p: "계정, 로그인, 서버가 없습니다. 입력한 모든 내용은 기기에 로컬로 저장됩니다."
  shots_h2: "실제 화면 보기"
  shots_sub: "iPhone에서 한 손으로 빠르게 사용할 수 있도록 설계된 깔끔한 인터페이스이며, iPad에도 맞게 확장됩니다."
  shots:
    - alt: "상품 사진, 사이즈, 재고 수준이 표시된 재고 목록"
      cap: "전체 재고 한눈에 보기"
    - alt: "이름, 가격, SKU, 설명, 카테고리, 사이즈를 입력하는 상품 추가 화면"
      cap: "상품 추가 및 정리"
    - alt: "상품 선택기와 날짜 달력이 있는 판매 기록 화면"
      cap: "판매 기록하기"
    - alt: "상품, 사이즈, 날짜를 보여 주는 판매 내역 목록"
      cap: "판매 내역"
    - alt: "언어 선택기가 있는 설정 화면"
      cap: "언어를 즉시 전환"
  how_h2: "사용 방법"
  how_sub: "빈 앱에서 관리되는 카탈로그까지, 단 몇 분이면 됩니다."
  steps:
    - h: "상품 추가"
      p: "사진을 찍거나 선택하고, 이름, 가격, SKU를 입력한 다음 사이즈와 초기 수량을 추가하세요."
    - h: "판매하고 기록"
      p: "상품이 팔리면 상품, 사이즈, 수량, 날짜와 함께 기록하세요. 재고가 자동으로 줄어듭니다."
    - h: "부족한 재고 확인"
      p: "재고 부족 또는 품절로 필터링해 어떤 상품을 다시 주문해야 하는지 정확히 확인하세요."
  free_h2: "무료로 시작하고, 더 필요하면 Pro"
  free_sub: "앱은 광고 없이 무료로 다운로드하고 사용할 수 있습니다. <strong>Inventory Pro</strong>는 판매 내역을 사용할 수 있게 해 주는 선택형 업그레이드입니다. 구독은 Apple ID를 통해 관리되며 언제든지 취소할 수 있습니다."
  free_links: '데이터가 어떻게 처리되는지는 <a href="{privacy_url}">개인정보 처리방침</a>에서 확인하시고, 더 자세한 내용은 <a href="{overview_url}">앱 전체 소개</a>를 참고하세요.'
  cta_h2: "Inventory & Stock Manager 받기"
  cta_sub: "iPhone과 iPad용으로 App Store에서 만나 보세요."

