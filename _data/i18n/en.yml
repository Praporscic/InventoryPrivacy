privacy:
  h1: "Privacy Policy"
  intro: |-
    <p>
      Inventory &amp; Stock Manager ("the app") is an offline stock/inventory tracker: you add products,
      sizes, and stock quantities, and everything you enter stays on your own device. There is no
      account, no sign-in, and no server operated by us — the app has nowhere to send your data even
      if it wanted to. This page explains what data is, and isn't, collected when you use it.
    </p>
  sections:
    - h: "Information We Collect"
      body: |-
        <p>
          The app itself does not collect, transmit, or store any personal information on any server —
          it has no backend and no user accounts. We do not ask you for your name, email address, phone
          number, location, contacts, or health data, and the app contains no analytics or crash-reporting
          SDK of any kind.
        </p>
    - h: "Information Stored Only on Your Device"
      body: |-
        <p>
          Everything you enter — product names, sizes, stock quantities, sale records, product photos, and
          your selected app language — is saved locally on your device using standard on-device storage
          (a local database and local file storage). None of it is uploaded, synced, or sent anywhere. If
          you delete a product or uninstall the app, that data is gone, because it never existed anywhere
          else.
        </p>
    - h: "Camera & Photo Library Access"
      body: |-
        <p>
          If you choose to attach a photo to a product, the app asks for camera or photo library access
          to let you pick or take that photo. The photo is resized and saved into the app's private local
          storage on your device only — it is never uploaded to us or to any third party.
        </p>
    - h: "Subscriptions & Purchases"
      body: |-
        <p>
          The app offers an optional Pro upgrade. Purchases are processed by Apple's App Store or Google
          Play, and subscription status is managed for us by <strong>RevenueCat</strong>, a third-party
          subscription platform. RevenueCat receives a randomly generated app user identifier and
          purchase/transaction data needed to validate your entitlement — we do not share your name, email,
          or payment details with them, because we never collect that information ourselves. See
          RevenueCat's own privacy policy for details on their data handling:
        </p>
        <ul>
          <li><a href="https://www.revenuecat.com/privacy" target="_blank" rel="noopener">RevenueCat Privacy Policy</a></li>
        </ul>
    - h: "Advertising"
      body: |-
        <p>
          The app contains no advertising and no advertising SDKs, and it does not track you across other
          apps or websites.
        </p>
    - h: "Children's Privacy"
      body: |-
        <p>
          This app is intended for a general audience and is not directed specifically at children under
          13. We do not knowingly collect personal information from children. If you believe a child has
          provided personal information through this app, please contact us so we can address it.
        </p>
    - h: "Data Security"
      body: |-
        <p>
          Because the app has no backend and transmits no personal data of its own, there is no
          app-managed remote storage of your information to secure. Data stored locally on your device is
          protected by your device's own operating system security. Any data handling associated with
          subscriptions is performed by Apple, Google or RevenueCat under their own security and privacy
          practices.
        </p>
    - h: "Your Choices"
      body: |-
        <p>
          Uninstalling the app permanently deletes everything it stored on your device (products, sizes,
          stock, sales history, and photos), since none of it exists anywhere else. You can manage or
          cancel your subscription at any time from your Apple ID or Google Play account settings, or via
          "Manage Subscription" in the app.
        </p>
    - h: "Changes to This Policy"
      body: |-
        <p>
          If this policy changes — for example, if a new feature or SDK is added — this page will be
          updated accordingly. We encourage you to review
          this page periodically.
        </p>
    - h: "Contact Us"
      body: |-
        <p>
          If you have questions about this privacy policy, contact us at:
          <br />
          <strong><a href="mailto:iosmyapps@yahoo.com">iosmyapps@yahoo.com</a></strong>
        </p>

about:
  hero_h1: "Your entire inventory. Under control."
  hero_lead: "Inventory & Stock Manager is a simple, offline stock tracker for iPhone and iPad. Add products, count stock by size, record sales and see what is running low — without an account or an internet connection."
  read_overview: "Read the full overview"
  hero_note: "Free to download. Works offline. Your data stays on your device."
  hero_img_alt: "Inventory & Stock Manager on iPhone showing a product list with sizes and stock counts"
  features_h2: "Everything you need to track stock"
  features_sub: "Built for small shops, market sellers, online resellers and anyone who keeps stock and wants a quick, clear view of it."
  features:
    - ico: "📦"
      h: "Products with photos"
      p: "Add a name, photo, price, SKU and description for every product, so you can recognise items at a glance."
    - ico: "📏"
      h: "Stock by size"
      p: "Give each product as many sizes as it needs and set the quantity for each one with simple +/– steppers."
    - ico: "🗂️"
      h: "Your own categories"
      p: "Create lists such as Color, Brand or Provider and attach them to products to keep a large catalog organised."
    - ico: "🔎"
      h: "Search and stock filters"
      p: "Find any product instantly and filter by All, In Stock, Low Stock or Out of Stock to see what needs restocking."
    - ico: "🛒"
      h: "Record sales in seconds"
      p: "Pick a product, size, quantity and date. Stock updates automatically when a sale is saved."
    - ico: "📈"
      h: "Sales history"
      p: "Review every recorded sale with product, size, quantity and date, and search through past sales."
    - ico: "🌍"
      h: "15 languages"
      p: "English, Chinese, Japanese, Spanish, French, German, Korean, Portuguese (Brazil), Italian, Russian, Romanian, Arabic, Turkish, Dutch and Indonesian."
    - ico: "🔒"
      h: "Private and offline"
      p: "No account, no sign-in and no server. Everything you enter is stored locally on your device."
  shots_h2: "See it in action"
  shots_sub: "A clean interface designed for quick, one-handed use on iPhone, and it scales to iPad."
  shots:
    - alt: "Inventory list with product photos, sizes and stock levels"
      cap: "Your whole inventory"
    - alt: "Add Product screen with name, price, SKU, description, categories and sizes"
      cap: "Add and organize products"
    - alt: "Record Sale screen with product picker and date calendar"
      cap: "Record a sale"
    - alt: "Sales History list showing products, sizes and dates"
      cap: "Sales history"
    - alt: "Settings screen with language picker"
      cap: "Switch language instantly"
  how_h2: "How it works"
  how_sub: "From an empty app to a tracked catalog in a few minutes."
  steps:
    - h: "Add your products"
      p: "Take or choose a photo, enter a name, price and SKU, then add sizes with their starting quantities."
    - h: "Sell and record"
      p: "When something sells, record it with the product, size, quantity and date. Stock goes down automatically."
    - h: "Check what is low"
      p: "Filter by Low Stock or Out of Stock and see exactly what needs reordering."
  free_h2: "Free to start, Pro if you want more"
  free_sub: "The app is free to download and use, with no ads. <strong>Inventory Pro</strong> is an optional upgrade that unlocks the sales history. Subscriptions are managed through your Apple ID and can be cancelled at any time."
  free_links: 'Read how your data is handled in the <a href="[privacy_url]">privacy policy</a>, or learn more in the <a href="[overview_url]">full app overview</a>.'
  cta_h2: "Get Inventory & Stock Manager"
  cta_sub: "Available on the App Store for iPhone and iPad."

