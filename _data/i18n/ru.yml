privacy:
  h1: "Политика конфиденциальности"
  intro: |-
    <p>
      Inventory &amp; Stock Manager («приложение») — это офлайн-приложение для учёта товарных запасов: вы добавляете товары,
      размеры и количество на складе, и всё, что вы вводите, остаётся на вашем устройстве. У нас нет
      аккаунтов, входа в систему и серверов — приложению некуда отправлять ваши данные,
      даже если бы оно захотело. На этой странице объясняется, какие данные собираются, а какие нет, когда вы пользуетесь приложением.
    </p>
  sections:
    - h: "Какие сведения мы собираем"
      body: |-
        <p>
          Само приложение не собирает, не передаёт и не хранит никаких персональных данных на каком-либо сервере —
          у него нет серверной части и нет учётных записей пользователей. Мы не запрашиваем ваше имя, адрес электронной почты, номер телефона,
          местоположение, контакты или данные о здоровье, и в приложении нет никаких SDK для аналитики
          или отправки отчётов о сбоях.
        </p>
    - h: "Сведения, которые хранятся только на вашем устройстве"
      body: |-
        <p>
          Всё, что вы вводите, — названия товаров, размеры, количество на складе, записи о продажах, фотографии товаров и
          выбранный язык приложения — сохраняется локально на вашем устройстве с помощью стандартного хранилища устройства
          (локальной базы данных и локального файлового хранилища). Ничего из этого не загружается, не синхронизируется и никуда не отправляется.
          Если вы удалите товар или само приложение, эти данные исчезнут, потому что нигде больше
          их не существовало.
        </p>
    - h: "Доступ к камере и фотогалерее"
      body: |-
        <p>
          Если вы решите прикрепить фото к товару, приложение запросит доступ к камере или фотогалерее,
          чтобы вы могли выбрать или сделать снимок. Фото уменьшается и сохраняется в закрытом локальном хранилище
          приложения только на вашем устройстве — оно никогда не загружается ни к нам, ни к третьим лицам.
        </p>
    - h: "Подписки и покупки"
      body: |-
        <p>
          В приложении есть необязательное обновление Pro. Покупки обрабатываются App Store от Apple или Google
          Play, а статусом подписки для нас управляет <strong>RevenueCat</strong> — сторонняя платформа
          подписок. RevenueCat получает случайно сформированный идентификатор пользователя приложения и данные
          о покупках и транзакциях, необходимые для подтверждения вашего права доступа. Мы не передаём им ваше имя, адрес электронной почты
          или платёжные данные, потому что сами никогда не собираем эту информацию. Подробности об обработке данных
          смотрите в политике конфиденциальности RevenueCat:
        </p>
        <ul>
          <li><a href="https://www.revenuecat.com/privacy" target="_blank" rel="noopener">Политика конфиденциальности RevenueCat</a></li>
        </ul>
    - h: "Реклама"
      body: |-
        <p>
          В приложении нет рекламы и рекламных SDK, и оно не отслеживает вас в других
          приложениях или на сайтах.
        </p>
    - h: "Конфиденциальность детей"
      body: |-
        <p>
          Это приложение рассчитано на широкую аудиторию и не предназначено специально для детей младше
          13 лет. Мы сознательно не собираем персональные данные детей. Если вы считаете, что ребёнок
          предоставил персональные данные через это приложение, свяжитесь с нами, чтобы мы могли решить этот вопрос.
        </p>
    - h: "Безопасность данных"
      body: |-
        <p>
          Поскольку у приложения нет серверной части и оно само не передаёт персональные данные, нет
          удалённого хранилища ваших сведений под управлением приложения, которое нужно было бы защищать. Данные, хранящиеся локально на вашем устройстве,
          защищены средствами безопасности операционной системы вашего устройства. Любая обработка данных, связанная
          с подписками, выполняется Apple, Google или RevenueCat в соответствии с их собственными правилами безопасности и конфиденциальности.
        </p>
    - h: "Ваш выбор"
      body: |-
        <p>
          Удаление приложения безвозвратно стирает всё, что оно хранило на вашем устройстве (товары, размеры,
          остатки, историю продаж и фотографии), поскольку нигде больше этого нет. Вы можете в любой момент управлять подпиской или
          отменить её в настройках Apple ID или аккаунта Google Play,
          а также через пункт «Управление подпиской» в приложении.
        </p>
    - h: "Изменения в этой политике"
      body: |-
        <p>
          Если эта политика изменится — например, при добавлении новой функции или SDK, — эта страница будет
          обновлена соответствующим образом. Рекомендуем периодически
          просматривать эту страницу.
        </p>
    - h: "Связаться с нами"
      body: |-
        <p>
          Если у вас есть вопросы об этой политике конфиденциальности, напишите нам:
          <br />
          <strong><a href="mailto:iosmyapps@yahoo.com">iosmyapps@yahoo.com</a></strong>
        </p>

about:
  hero_h1: "Весь ваш инвентарь. Под контролем."
  hero_lead: "Inventory & Stock Manager — простое офлайн-приложение для учёта запасов на iPhone и iPad. Добавляйте товары, считайте остатки по размерам, записывайте продажи и узнавайте, что заканчивается, — без аккаунта и без интернета."
  read_overview: "Читать полный обзор"
  hero_note: "Скачивание бесплатно. Работает офлайн. Ваши данные остаются на вашем устройстве."
  hero_img_alt: "Inventory & Stock Manager на iPhone со списком товаров, размерами и остатками"
  features_h2: "Всё необходимое для учёта запасов"
  features_sub: "Создано для небольших магазинов, продавцов на рынках, интернет-перепродавцов и всех, кто хранит товар и хочет быстро и наглядно видеть остатки."
  features:
    - ico: "📦"
      h: "Товары с фотографиями"
      p: "Добавляйте для каждого товара название, фото, цену, артикул (SKU) и описание, чтобы узнавать позиции с первого взгляда."
    - ico: "📏"
      h: "Остатки по размерам"
      p: "Задавайте каждому товару столько размеров, сколько нужно, и меняйте количество каждого простыми кнопками +/–."
    - ico: "🗂️"
      h: "Собственные категории"
      p: "Создавайте списки, например «Цвет», «Бренд» или «Поставщик», и привязывайте их к товарам, чтобы большой каталог оставался упорядоченным."
    - ico: "🔎"
      h: "Поиск и фильтры остатков"
      p: "Мгновенно находите любой товар и фильтруйте по статусам «Все», «В наличии», «Заканчивается» и «Нет в наличии», чтобы видеть, что пора пополнить."
    - ico: "🛒"
      h: "Запись продаж за секунды"
      p: "Выберите товар, размер, количество и дату. Остатки обновятся автоматически, как только продажа сохранена."
    - ico: "📈"
      h: "История продаж"
      p: "Просматривайте каждую записанную продажу с товаром, размером, количеством и датой и ищите по прошлым продажам."
    - ico: "🌍"
      h: "15 языков"
      p: "Английский, китайский, японский, испанский, французский, немецкий, корейский, португальский (Бразилия), итальянский, русский, румынский, арабский, турецкий, нидерландский и индонезийский."
    - ico: "🔒"
      h: "Приватно и офлайн"
      p: "Без аккаунта, без входа и без сервера. Всё, что вы вводите, хранится локально на вашем устройстве."
  shots_h2: "Посмотрите в действии"
  shots_sub: "Чистый интерфейс для быстрой работы одной рукой на iPhone, который масштабируется и на iPad."
  shots:
    - alt: "Список инвентаря с фотографиями товаров, размерами и остатками"
      cap: "Весь ваш инвентарь"
    - alt: "Экран «Добавить товар» с названием, ценой, артикулом, описанием, категориями и размерами"
      cap: "Добавляйте и упорядочивайте товары"
    - alt: "Экран «Записать продажу» с выбором товара и календарём"
      cap: "Запишите продажу"
    - alt: "Список истории продаж с товарами, размерами и датами"
      cap: "История продаж"
    - alt: "Экран настроек с выбором языка"
      cap: "Мгновенная смена языка"
  how_h2: "Как это работает"
  how_sub: "От пустого приложения до готового каталога за несколько минут."
  steps:
    - h: "Добавьте товары"
      p: "Сделайте или выберите фото, введите название, цену и артикул, затем добавьте размеры с начальным количеством."
    - h: "Продавайте и записывайте"
      p: "Когда что-то продаётся, запишите это с товаром, размером, количеством и датой. Остатки уменьшатся автоматически."
    - h: "Проверяйте, что заканчивается"
      p: "Отфильтруйте по статусам «Заканчивается» или «Нет в наличии» и увидите, что именно нужно заказать."
  free_h2: "Бесплатно для начала, Pro — если нужно больше"
  free_sub: "Приложение бесплатно скачивать и использовать, без рекламы. <strong>Inventory Pro</strong> — необязательное обновление, открывающее историю продаж. Подписками можно управлять через ваш Apple ID, и их можно отменить в любой момент."
  free_links: 'Как обрабатываются ваши данные, читайте в <a href="[privacy_url]">политике конфиденциальности</a>, а подробнее о приложении — в <a href="[overview_url]">полном обзоре</a>.'
  cta_h2: "Скачайте Inventory & Stock Manager"
  cta_sub: "Доступно в App Store для iPhone и iPad."

