privacy:
  h1: "سياسة الخصوصية"
  intro: |-
    <p>
      Inventory &amp; Stock Manager («التطبيق») أداة لتتبّع المخزون والبضائع تعمل دون اتصال: تضيف المنتجات
      والمقاسات وكميات المخزون، ويبقى كل ما تدخله على جهازك أنت. لا يوجد
      حساب ولا تسجيل دخول ولا خادم نديره — فلا يملك التطبيق مكانًا يرسل إليه بياناتك
      حتى لو أراد ذلك. توضح هذه الصفحة البيانات التي تُجمع والتي لا تُجمع عند استخدامك له.
    </p>
  sections:
    - h: "المعلومات التي نجمعها"
      body: |-
        <p>
          لا يجمع التطبيق نفسه أي معلومات شخصية ولا ينقلها ولا يخزّنها على أي خادم —
          فليس له خادم خلفي ولا حسابات مستخدمين. نحن لا نطلب منك اسمك أو بريدك الإلكتروني أو رقم هاتفك
          أو موقعك أو جهات اتصالك أو بياناتك الصحية، ولا يحتوي التطبيق على أي حزمة تطوير (SDK) للتحليلات
          أو للإبلاغ عن الأعطال.
        </p>
    - h: "المعلومات المخزّنة على جهازك فقط"
      body: |-
        <p>
          كل ما تدخله — أسماء المنتجات والمقاسات وكميات المخزون وسجلات المبيعات وصور المنتجات
          ولغة التطبيق التي اخترتها — يُحفظ محليًا على جهازك باستخدام التخزين القياسي في الجهاز
          (قاعدة بيانات محلية وتخزين ملفات محلي). لا يُرفع أي منها ولا يُزامَن ولا يُرسل إلى أي مكان.
          وإذا حذفت منتجًا أو أزلت التطبيق، فإن تلك البيانات تزول، لأنها لم تكن موجودة في أي مكان
          آخر.
        </p>
    - h: "الوصول إلى الكاميرا ومكتبة الصور"
      body: |-
        <p>
          إذا اخترت إرفاق صورة بمنتج، يطلب التطبيق الوصول إلى الكاميرا أو مكتبة الصور
          لتتمكن من اختيار الصورة أو التقاطها. تُصغَّر الصورة وتُحفظ في التخزين المحلي الخاص بالتطبيق
          على جهازك فقط — ولا تُرفع أبدًا إلينا ولا إلى أي طرف ثالث.
        </p>
    - h: "الاشتراكات والمشتريات"
      body: |-
        <p>
          يقدّم التطبيق ترقية Pro اختيارية. تُعالَج المشتريات عبر App Store من Apple أو Google
          Play، وتُدار حالة الاشتراك نيابةً عنا بواسطة <strong>RevenueCat</strong>، وهي منصة
          اشتراكات تابعة لطرف ثالث. تتلقى RevenueCat معرّف مستخدم للتطبيق يُنشأ عشوائيًا وبيانات
          الشراء والمعاملات اللازمة للتحقق من استحقاقك — ولا نشارك معها اسمك أو بريدك الإلكتروني
          أو بيانات الدفع، لأننا لا نجمع هذه المعلومات أصلًا. راجع سياسة الخصوصية
          الخاصة بـ RevenueCat لمعرفة كيفية تعاملها مع البيانات:
        </p>
        <ul>
          <li><a href="https://www.revenuecat.com/privacy" target="_blank" rel="noopener">سياسة خصوصية RevenueCat</a></li>
        </ul>
    - h: "الإعلانات"
      body: |-
        <p>
          لا يحتوي التطبيق على إعلانات ولا على أي حزم تطوير إعلانية، ولا يتتبّعك عبر تطبيقات
          أو مواقع أخرى.
        </p>
    - h: "خصوصية الأطفال"
      body: |-
        <p>
          هذا التطبيق موجّه إلى عامة المستخدمين وليس موجّهًا تحديدًا إلى الأطفال دون سن
          13 عامًا. لا نجمع عن علم معلومات شخصية من الأطفال. وإذا كنت تعتقد أن طفلًا قد
          قدّم معلومات شخصية عبر هذا التطبيق، فيُرجى التواصل معنا لنتمكن من معالجة الأمر.
        </p>
    - h: "أمان البيانات"
      body: |-
        <p>
          لأن التطبيق ليس له خادم خلفي ولا ينقل بيانات شخصية من تلقاء نفسه، فلا يوجد
          تخزين بعيد لمعلوماتك يديره التطبيق ويحتاج إلى تأمين. أما البيانات المخزّنة محليًا على جهازك فهي
          محمية بأمان نظام التشغيل في جهازك نفسه. وأي معالجة للبيانات مرتبطة
          بالاشتراكات تجريها Apple أو Google أو RevenueCat وفق ممارساتها الخاصة في الأمان والخصوصية.
        </p>
    - h: "خياراتك"
      body: |-
        <p>
          يؤدي حذف التطبيق إلى مسح كل ما خزّنه على جهازك نهائيًا (المنتجات والمقاسات
          والمخزون وسجل المبيعات والصور)، إذ لا يوجد أي منها في مكان آخر. يمكنك إدارة اشتراكك أو
          إلغاؤه في أي وقت من إعدادات معرّف Apple أو حساب Google Play،
          أو عبر «إدارة الاشتراك» داخل التطبيق.
        </p>
    - h: "التغييرات على هذه السياسة"
      body: |-
        <p>
          إذا تغيّرت هذه السياسة — مثلًا عند إضافة ميزة جديدة أو حزمة تطوير جديدة — فسيجري تحديث هذه الصفحة
          وفقًا لذلك. ونشجّعك على مراجعة
          هذه الصفحة بشكل دوري.
        </p>
    - h: "اتصل بنا"
      body: |-
        <p>
          إذا كانت لديك أسئلة حول سياسة الخصوصية هذه، فتواصل معنا على:
          <br />
          <strong><a href="mailto:iosmyapps@yahoo.com">iosmyapps@yahoo.com</a></strong>
        </p>

about:
  hero_h1: "كل مخزونك. تحت السيطرة."
  hero_lead: "Inventory & Stock Manager أداة بسيطة لتتبّع المخزون تعمل دون اتصال على iPhone وiPad. أضف المنتجات، واحسب المخزون حسب المقاس، وسجّل المبيعات، واعرف ما أوشك على النفاد — دون حساب ودون اتصال بالإنترنت."
  read_overview: "اقرأ النظرة العامة الكاملة"
  hero_note: "التنزيل مجاني. يعمل دون اتصال. تبقى بياناتك على جهازك."
  hero_img_alt: "تطبيق Inventory & Stock Manager على iPhone يعرض قائمة منتجات مع المقاسات وأعداد المخزون"
  features_h2: "كل ما تحتاجه لتتبّع المخزون"
  features_sub: "مصمم للمتاجر الصغيرة وبائعي الأسواق وتجار إعادة البيع عبر الإنترنت وكل من لديه مخزون ويريد رؤية سريعة وواضحة له."
  features:
    - ico: "📦"
      h: "منتجات مع صور"
      p: "أضف الاسم والصورة والسعر ورمز SKU والوصف لكل منتج لتتعرف على الأصناف بنظرة واحدة."
    - ico: "📏"
      h: "المخزون حسب المقاس"
      p: "امنح كل منتج ما يحتاجه من المقاسات وحدّد كمية كل مقاس بأزرار +/– بسيطة."
    - ico: "🗂️"
      h: "تصنيفاتك الخاصة"
      p: "أنشئ قوائم مثل اللون أو العلامة التجارية أو المورّد واربطها بالمنتجات للحفاظ على ترتيب كتالوج كبير."
    - ico: "🔎"
      h: "بحث ومرشّحات المخزون"
      p: "اعثر على أي منتج فورًا وصفِّ حسب الكل أو متوفر أو مخزون منخفض أو نفد المخزون لترى ما يحتاج إلى إعادة تخزين."
    - ico: "🛒"
      h: "سجّل المبيعات في ثوانٍ"
      p: "اختر المنتج والمقاس والكمية والتاريخ. يتحدّث المخزون تلقائيًا عند حفظ عملية البيع."
    - ico: "📈"
      h: "سجل المبيعات"
      p: "راجع كل عملية بيع مسجّلة مع المنتج والمقاس والكمية والتاريخ، وابحث في المبيعات السابقة."
    - ico: "🌍"
      h: "15 لغة"
      p: "الإنجليزية والصينية واليابانية والإسبانية والفرنسية والألمانية والكورية والبرتغالية (البرازيل) والإيطالية والروسية والرومانية والعربية والتركية والهولندية والإندونيسية."
    - ico: "🔒"
      h: "خاص ويعمل دون اتصال"
      p: "لا حساب ولا تسجيل دخول ولا خادم. كل ما تدخله يُخزَّن محليًا على جهازك."
  shots_h2: "شاهده أثناء العمل"
  shots_sub: "واجهة نظيفة مصممة للاستخدام السريع بيد واحدة على iPhone، وتتكيف مع شاشة iPad."
  shots:
    - alt: "قائمة المخزون مع صور المنتجات والمقاسات ومستويات المخزون"
      cap: "مخزونك بالكامل"
    - alt: "شاشة إضافة منتج مع الاسم والسعر ورمز SKU والوصف والتصنيفات والمقاسات"
      cap: "أضف المنتجات ونظّمها"
    - alt: "شاشة تسجيل عملية بيع مع منتقي المنتج وتقويم التاريخ"
      cap: "سجّل عملية بيع"
    - alt: "قائمة سجل المبيعات تعرض المنتجات والمقاسات والتواريخ"
      cap: "سجل المبيعات"
    - alt: "شاشة الإعدادات مع منتقي اللغة"
      cap: "بدّل اللغة فورًا"
  how_h2: "كيف يعمل"
  how_sub: "من تطبيق فارغ إلى كتالوج متتبَّع في دقائق قليلة."
  steps:
    - h: "أضف منتجاتك"
      p: "التقط صورة أو اخترها، وأدخل الاسم والسعر ورمز SKU، ثم أضف المقاسات مع كمياتها الأولية."
    - h: "بِع وسجّل"
      p: "عند بيع أي شيء، سجّله مع المنتج والمقاس والكمية والتاريخ. ينخفض المخزون تلقائيًا."
    - h: "تحقق مما أوشك على النفاد"
      p: "صفِّ حسب مخزون منخفض أو نفد المخزون واعرف بالضبط ما يحتاج إلى إعادة طلب."
  free_h2: "مجاني للبدء، وPro إن أردت المزيد"
  free_sub: "التطبيق مجاني للتنزيل والاستخدام ودون إعلانات. <strong>Inventory Pro</strong> ترقية اختيارية تتيح سجل المبيعات. تُدار الاشتراكات عبر معرّف Apple الخاص بك ويمكن إلغاؤها في أي وقت."
  free_links: 'اقرأ كيف نتعامل مع بياناتك في <a href="[privacy_url]">سياسة الخصوصية</a>، أو اعرف المزيد في <a href="[overview_url]">النظرة العامة الكاملة على التطبيق</a>.'
  cta_h2: "احصل على Inventory & Stock Manager"
  cta_sub: "متوفر في App Store لأجهزة iPhone وiPad."

