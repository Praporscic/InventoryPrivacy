privacy:
  h1: "プライバシーポリシー"
  intro: |-
    <p>
      Inventory &amp; Stock Manager（以下「本アプリ」）は、オフラインで使える在庫管理ツールです。商品、
      サイズ、在庫数を登録でき、入力した内容はすべてお使いの端末内にのみ保存されます。
      アカウントもサインインも、当方が運用するサーバーもありません。本アプリには、たとえ送信したくても
      データの送信先がありません。このページでは、本アプリのご利用時に収集されるデータと収集されないデータについて説明します。
    </p>
  sections:
    - h: "収集する情報"
      body: |-
        <p>
          本アプリ自体は、いかなるサーバーにも個人情報を収集・送信・保存しません。
          バックエンドもユーザーアカウントもありません。お名前、メールアドレス、電話番号、
          位置情報、連絡先、健康データをお尋ねすることはなく、分析用やクラッシュレポート用の
          SDK も一切含まれていません。
        </p>
    - h: "端末内にのみ保存される情報"
      body: |-
        <p>
          入力されたすべての内容（商品名、サイズ、在庫数、販売記録、商品写真、選択したアプリの言語）は、
          端末の標準的なローカル保存領域（ローカルデータベースとローカルファイルストレージ）を使って
          端末内に保存されます。これらがアップロード、同期、送信されることは一切ありません。
          商品を削除したりアプリをアンインストールしたりすると、そのデータは他の場所には存在しないため、完全に失われます。
        </p>
    - h: "カメラとフォトライブラリへのアクセス"
      body: |-
        <p>
          商品に写真を添付する場合、写真を選択または撮影するために、本アプリはカメラまたは
          フォトライブラリへのアクセスを求めます。写真はサイズが縮小され、端末内のアプリ専用の
          ローカルストレージにのみ保存されます。当方や第三者にアップロードされることはありません。
        </p>
    - h: "サブスクリプションと購入"
      body: |-
        <p>
          本アプリには、任意で利用できる Pro アップグレードがあります。購入は Apple の App Store または Google
          Play によって処理され、サブスクリプションの状態は、第三者のサブスクリプション管理プラットフォームである
          <strong>RevenueCat</strong> が当方に代わって管理します。RevenueCat には、ランダムに生成されたアプリユーザー識別子と、
          利用権限の確認に必要な購入・取引データが送られます。お名前、メールアドレス、お支払い情報は
          当方が収集していないため、RevenueCat と共有することはありません。データの取り扱いの詳細は、
          RevenueCat 自身のプライバシーポリシーをご覧ください。
        </p>
        <ul>
          <li><a href="https://www.revenuecat.com/privacy" target="_blank" rel="noopener">RevenueCat プライバシーポリシー</a></li>
        </ul>
    - h: "広告"
      body: |-
        <p>
          本アプリには広告も広告 SDK も含まれておらず、他のアプリやウェブサイトをまたいであなたを追跡することもありません。
        </p>
    - h: "お子様のプライバシー"
      body: |-
        <p>
          本アプリは一般の方を対象としており、13 歳未満のお子様を特に対象としたものではありません。
          当方が 13 歳未満のお子様の個人情報を意図的に収集することはありません。お子様が本アプリを通じて
          個人情報を提供したと思われる場合は、対処できるようご連絡ください。
        </p>
    - h: "データのセキュリティ"
      body: |-
        <p>
          本アプリにはバックエンドがなく、アプリ自体が個人データを送信することもないため、
          保護すべきアプリ管理のリモートストレージは存在しません。端末内に保存されたデータは、
          お使いの端末の OS が備えるセキュリティによって保護されます。サブスクリプションに関するデータの取り扱いは、
          Apple、Google、RevenueCat がそれぞれのセキュリティおよびプライバシーに関する方針に基づいて行います。
        </p>
    - h: "お客様の選択"
      body: |-
        <p>
          アプリをアンインストールすると、端末に保存されていたすべてのデータ（商品、サイズ、在庫、
          販売履歴、写真）が完全に削除されます。これらは他の場所には存在しません。サブスクリプションは、
          Apple ID または Google Play アカウントの設定、またはアプリ内の「サブスクリプションを管理」から
          いつでも管理・解約できます。
        </p>
    - h: "本ポリシーの変更"
      body: |-
        <p>
          新機能や SDK の追加などにより本ポリシーが変更される場合は、このページを更新します。
          定期的にこのページをご確認いただくことをおすすめします。
        </p>
    - h: "お問い合わせ"
      body: |-
        <p>
          本プライバシーポリシーに関するご質問は、次の宛先までご連絡ください。
          <br />
          <strong><a href="mailto:iosmyapps@yahoo.com">iosmyapps@yahoo.com</a></strong>
        </p>

about:
  hero_h1: "すべての在庫を、しっかり管理。"
  hero_lead: "Inventory & Stock Manager は、iPhone と iPad 向けのシンプルなオフライン在庫管理アプリです。商品を追加し、サイズごとに在庫を数え、販売を記録して、残りが少ない商品をひと目で確認できます。アカウントもインターネット接続も不要です。"
  read_overview: "詳しい紹介を読む"
  hero_note: "ダウンロード無料。オフラインで動作。データは端末内に保存されます。"
  hero_img_alt: "iPhone 上の Inventory & Stock Manager。サイズと在庫数付きの商品リストを表示"
  features_h2: "在庫管理に必要なすべてを"
  features_sub: "小さなお店、マーケットの販売者、ネット転売、そして在庫を持ち、手早く分かりやすく把握したいすべての方のために作られています。"
  features:
    - ico: "📦"
      h: "写真付きの商品"
      p: "商品ごとに名前、写真、価格、SKU、説明を追加でき、ひと目で商品を見分けられます。"
    - ico: "📏"
      h: "サイズ別の在庫"
      p: "商品ごとに必要なだけサイズを追加し、シンプルな +/– ボタンでサイズごとの数量を設定できます。"
    - ico: "🗂️"
      h: "オリジナルのカテゴリ"
      p: "「色」「ブランド」「仕入れ先」などのリストを作って商品に割り当て、大量のカタログも整理できます。"
    - ico: "🔎"
      h: "検索と在庫フィルタ"
      p: "商品を即座に検索し、「すべて」「在庫あり」「残りわずか」「在庫切れ」で絞り込んで、補充が必要な商品を確認できます。"
    - ico: "🛒"
      h: "数秒で販売を記録"
      p: "商品、サイズ、数量、日付を選ぶだけ。販売を保存すると在庫が自動で更新されます。"
    - ico: "📈"
      h: "販売履歴"
      p: "記録した販売を、商品・サイズ・数量・日付とともに確認でき、過去の販売も検索できます。"
    - ico: "🌍"
      h: "15 言語に対応"
      p: "英語、中国語、日本語、スペイン語、フランス語、ドイツ語、韓国語、ポルトガル語（ブラジル）、イタリア語、ロシア語、ルーマニア語、アラビア語、トルコ語、オランダ語、インドネシア語。"
    - ico: "🔒"
      h: "プライベートでオフライン"
      p: "アカウントもサインインもサーバーも不要。入力した内容はすべて端末内に保存されます。"
  shots_h2: "実際の画面"
  shots_sub: "iPhone で片手でもすばやく操作できるすっきりしたデザインで、iPad にも対応します。"
  shots:
    - alt: "商品写真、サイズ、在庫数が並ぶ在庫リスト"
      cap: "すべての在庫を一覧"
    - alt: "名前、価格、SKU、説明、カテゴリ、サイズを入力する「商品を追加」画面"
      cap: "商品を追加して整理"
    - alt: "商品ピッカーと日付カレンダーがある「販売を記録」画面"
      cap: "販売を記録"
    - alt: "商品、サイズ、日付を表示する販売履歴リスト"
      cap: "販売履歴"
    - alt: "言語ピッカーがある設定画面"
      cap: "言語をすぐに切り替え"
  how_h2: "使い方"
  how_sub: "空のアプリから、数分で管理できるカタログに。"
  steps:
    - h: "商品を追加"
      p: "写真を撮るか選び、名前・価格・SKU を入力して、サイズと初期数量を追加します。"
    - h: "販売して記録"
      p: "商品が売れたら、商品・サイズ・数量・日付を記録します。在庫は自動的に減ります。"
    - h: "残りわずかな商品を確認"
      p: "「残りわずか」や「在庫切れ」で絞り込めば、発注が必要な商品がすぐ分かります。"
  free_h2: "無料で始めて、必要なら Pro へ"
  free_sub: "アプリは広告なしで無料でダウンロード・利用できます。<strong>Inventory Pro</strong> は、販売履歴が使えるようになる任意のアップグレードです。サブスクリプションは Apple ID で管理され、いつでも解約できます。"
  free_links: 'データの取り扱いについては<a href="{privacy_url}">プライバシーポリシー</a>を、詳しくは<a href="{overview_url}">アプリの詳しい紹介</a>をご覧ください。'
  cta_h2: "Inventory & Stock Manager を入手"
  cta_sub: "iPhone と iPad 向けに App Store で配信中。"

