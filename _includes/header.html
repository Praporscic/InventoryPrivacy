{%- assign path = page.url | replace: 'index.html', '' -%}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/about/' | relative_url }}">
      <img src="{{ '/assets/img/icon-192.webp' | relative_url }}" alt="" width="32" height="32">
      <span>Inventory &amp; Stock Manager</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if path == '/' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/about/' | relative_url }}"{% if path contains '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/articles/' | relative_url }}"{% if path contains '/articles/' %} aria-current="page"{% endif %}>Articles</a>
      <a class="nav-cta" href="{{ site.app_store_url }}" rel="noopener">Get the app</a>
    </nav>
  </div>
</header>
